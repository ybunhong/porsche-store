<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product List</title>
    <link rel="icon" type="image/svg" href="../../src/assets/brand-logo/porsche-icon.svg" />
    <script type="module" src="/main.js"></script>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <link rel="stylesheet" href="./product-list.css " />
  </head>
  <body>
    <!-- Header section -->
    <base-header></base-header>
    <!-- Title section -->
    <div class="title flex flex-col w-full h-fit gap-8 py-4">
      <div class="outer-container w-full">
        <div class="back flex items-center w-fit">
          <icon-button
            icon="../../src/assets/icons/navigation/chevron.svg"
            size="1"
            class="chevron-left"
          >
          </icon-button>
          <a class="under-line">Porsche Shop</a>
          <a class="line px-1" href="#">|</a>
          <a href="#">Clothing</a>
        </div>
      </div>
      <div class="product-title w-full flex justify-start">
        <h1>Clothing</h1>
      </div>
    </div>
    <!-- Product Category -->
    <div class="category pb-3 w-full">
      <horizontal-scroller>
        <base-button class="w-fit" label="All products" variant="black"></base-button>
        <base-button class="w-fit" label="Children's clothes" variant="secondary"></base-button>
        <base-button class="w-fit" label="Men" variant="secondary"></base-button>
        <base-button class="w-fit" label="Women" variant="secondary"></base-button>
      </horizontal-scroller>
    </div>
    <!-- filter section -->
    <div class="filter w-full">
      <filter-topresult-buttons></filter-topresult-buttons>
    </div>

    <!-- Product Quantity section -->

    <div class="quantity block py-3">
      <div class="container flex items-center w-fit">
        <span>30 Products</span>
        <icon-button icon="/src/assets/icons/indicator/information.svg"></icon-button>
      </div>
    </div>

    <!-- product display section -->
    <div class="product-display gap-2 w-full h-fit mt-4">
      <div class="product-card-list">
        <product-card
          class="product-card-content"
          description="Reversible jacket"
          price="$529.00"
          src="/src/assets/card/green-shirt.avif"
        >
        </product-card>
      </div>
      <div class="product-card-list">
        <product-card
          class="product-card-content"
          description="Seasonal T-shirt"
          price="$155.00"
          discount="$108.50"
          src="/src/assets/card/white-shirt.avif"
        >
        </product-card>
      </div>
      <div class="product-card-list">
        <product-card
          class="product-card-content"
          description="Lightweight Jacket"
          price="$50.00"
          src="/src/assets/card/shirt-3.avif"
        >
        </product-card>
      </div>
      <div class="product-card-list">
        <product-card
          class="product-card-content"
          description="Suede Leather Jacket"
          price="$215.00"
          src="/src/assets/card/shirt-4.avif"
        >
        </product-card>
      </div>
      <div class="product-card-list">
        <product-card
          class="product-card-content"
          description="Reversible jacket"
          price="$170.00"
          discount="$105.00"
          src="/src/assets/card/shirt-5.avif"
        >
        </product-card>
      </div>
      <div class="product-card-list">
        <product-card
          class="product-card-content"
          description="Reversible jacket"
          price="$460.00"
          discount="$279.00"
          src="/src/assets/card/shirt-6.avif"
        >
        </product-card>
      </div>
      <div class="product-card-list">
        <product-card
          class="product-card-content"
          description="Cabrio Leather Jacket"
          price="$350.00"
          src="/src/assets/card/shirt-7.avif"
        >
        </product-card>
      </div>
      <div class="product-card-list">
        <product-card
          class="product-card-content"
          description="Suede Leather Jacket"
          price="$39.00"
          src="/src/assets/card/shirt-8.avif"
        >
        </product-card>
      </div>
      <div class="product-card-list">
        <product-card
          class="product-card-content"
          description="Women's T-shirt"
          price="$109.00"
          src="/src/assets/card/shirt-9.avif"
        >
        </product-card>
      </div>
      <div class="product-card-list">
        <product-card
          class="product-card-content"
          description="Man Hoodies"
          price="$435.00"
          discount="$265.00"
          src="/src/assets/card/shirt-10.avif"
        >
        </product-card>
      </div>
    </div>
    <!-- load more section -->
    <div class="load-more flex justify-center items-center flex-col gap-3 mt-4 ml-10 mr-10 pb-6">
      <span class="number w-fit text-center font-bold">10/30 products</span>
      <div class="load-more-button">
        <!-- <base-button label="Load more products" variant="primary"></base-button> -->
        <div class="load-more-button">
          <base-button
            class="w-full"
            id="load-more-btn"
            label="Load more products"
            variant="primary"
          ></base-button>
        </div>
      </div>
      <div class="top-result hidden gap-12 px-3 py-2 border border-medium rounded-sm">
        <span>Top results</span>
        <icon-button
          icon="/src/assets/icons/navigation/chevron.svg"
          size="1.1"
          class="chevron-down"
        >
        </icon-button>
      </div>
    </div>
    <!-- show more section -->
    <show-more-card content="4"></show-more-card>
    <!-- footer section -->
    <div class="footer text-center bg-success">
      <footer-a></footer-a>
    </div>
  </body>
</html>
