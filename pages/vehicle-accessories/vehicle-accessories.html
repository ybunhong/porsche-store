<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Load your JS normally -->
    <script type="module" src="/main2.js"></script>

    <!-- ✅ FIXED: CSS now from /public/styles -->
    <link rel="stylesheet" href="/styles/index.css" />
    <link rel="stylesheet" href="./vehicle-accessories.css" />

    <!-- ✅ FIXED: Favicon path from /public/assets -->
    <link rel="icon" type="image/svg+xml" href="/assets/brand-logo/porsche-icon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porsche Accessories for Your Car</title>
  </head>

  <body>
    <!-- header -->
    <base-header></base-header>

    <h1 class="pt-6 pb-4 flex justify-center">Vehicle accessories</h1>

    <model-selection-panel></model-selection-panel>

    <!-- scroller -->
    <div class="vehicle-accessories-scroller py-6">
      <horizontal-scroller class="w-full">
        <base-button variant="secondary" label="All products"></base-button>
        <base-button variant="secondary" label="Baby Carriers & Child Seats"></base-button>
        <base-button variant="secondary" label="Car Covers"></base-button>
        <base-button variant="secondary" label="Car Cover & Protection"></base-button>
        <base-button variant="secondary" label="Charging Equipment"></base-button>
        <base-button variant="secondary" label="Floor Mats & Luggage Compartment"></base-button>
        <base-button variant="secondary" label="Models"></base-button>
        <base-button variant="secondary" label="Others Vehicle Accessories"></base-button>
        <base-button variant="secondary" label="Porsche Classic"></base-button>
        <base-button variant="secondary" label="The first all-electric Macan"></base-button>
        <base-button variant="secondary" label="Travel & Transport"></base-button>
      </horizontal-scroller>
    </div>

    <div class="filter w-full">
      <filter-topresult-buttons></filter-topresult-buttons>
    </div>

    <!-- product quantity -->
    <div class="quantity block py-3">
      <div class="container flex items-center w-fit">
        <span>30 Products</span>
        <icon-button icon="/assets/icons/indicator/information.svg"></icon-button>
      </div>
    </div>

    <!-- products -->
    <div class="product-display gap-3 w-full h-fit mt-4">
      <a href="../product-details/product-detail8.html">
        <div class="product-card-list">
          <product-card
            class="product-card-content"
            description="Elegant polo shirt with Porsche branding."
            price="£55.00"
            src="/assets/image/shirt/1.avif"
          ></product-card>
        </div>
      </a>
      <a href="../product-details/product-detail5.html">
        <div class="product-card-list">
          <product-card
            class="product-card-content"
            description="Espresso cup set with heritage print."
            price="£15.00"
            src="/assets/image/cup/1.avif"
          ></product-card>
        </div>
      </a>
      <a href="../product-details/product-detail1.html">
        <div class="product-card-list">
          <product-card
            class="product-card-content"
            description="Spacious canvas bag with vintage Porsche design."
            price="£70.00"
            src="/assets/image/bag/1.avif"
          ></product-card>
        </div>
      </a>
      <a href="../product-details/product-detail10.html">
        <div class="product-card-list">
          <product-card
            class="product-card-content"
            description="Premium Porsche chronograph with titanium case and leather strap."
            price="£650.00"
            src="/assets/image/watch/1.avif"
          ></product-card>
        </div>
      </a>
      <a href="../product-details/product-detail2.html">
        <div class="product-card-list">
          <product-card
            class="product-card-content"
            description="Classic Porsche Motorsport cap with adjustable strap."
            price="£35.00"
            src="/assets/image/cap/1.avif"
          ></product-card>
        </div>
      </a>
      <a href="../product-details/product-detail3.html">
        <div class="product-card-list">
          <product-card
            class="product-card-content"
            description="Highly detailed Porsche 911 diecast scale model."
            price="£45.00"
            src="/assets/image/car/1.avif"
          ></product-card>
        </div>
      </a>
      <a href="../product-details/product-detail9.html">
        <div class="product-card-list">
          <product-card
            class="product-card-content"
            description="Comfortable sneakers made for driving and casual wear."
            price="£129.00"
            src="/assets/image/shoes/1.avif"
          ></product-card>
        </div>
      </a>
      <a href="../product-details/product-detail4.html">
        <div class="product-card-list">
          <product-card
            class="product-card-content"
            description="Insulated cool bag with Porsche crest."
            price="£60.00"
            src="/assets/image/coolbag/1.avif"
          ></product-card>
        </div>
      </a>
      <a href="../product-details/product-detail7.html">
        <div class="product-card-list">
          <product-card
            class="product-card-content"
            description="Lightweight hardcase with Porsche branding."
            price="£299.00"
            src="/assets/image/luggage/7.avif"
          ></product-card>
        </div>
      </a>
      <a href="../product-details/product-detail6.html">
        <div class="product-card-list">
          <product-card
            class="product-card-content"
            description="Soft long sleeve cotton shirt with Porsche heritage graphics."
            price="£50.00"
            src="/assets/image/longshirt/1.avif"
          ></product-card>
        </div>
      </a>
    </div>

    <!-- load more -->
    <div class="load-more flex justify-center items-center flex-col gap-3 mt-4 ml-10 mr-10 pb-6">
      <span class="number w-fit text-center font-bold">10/30 products</span>
      <base-button
        class="w-full"
        id="load-more-btn"
        label="Load more products"
        variant="primary"
      ></base-button>
    </div>

    <!-- show more -->
    <show-more-card content="4"></show-more-card>

    <!-- footer -->
    <footer-a class="footer text-center bg-success"></footer-a>
  </body>
</html>
