<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="module" src="/main.js"></script>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in</title>
  </head>
  <body class="bg-black">
    <div class="bg-screen bg-white flex flex-col items-center justify-center">
      <!-- Left image shown only on large screens -->
      <div class="left-side-image">
        <img src="../src/assets/image/bgAuthPage.webp" alt="Porsche promotional background" />
      </div>
      <!-- login card  -->
      <form class="login-card bg-white flex items-center justify-center px-5 py-5">
        <div class="login-card-contents bg-white w-full">
          <!-- header contents -->
          <div class="flex flex-col items-center justify-center gap-5">
            <img
              class="brand-logo"
              src="../src/assets/brand-logo/porsche-icon-text.svg"
              alt="logotext"
            />
            <h3 class="heading-md">Welcome! Log in with your Porsche ID</h3>
          </div>
          <!-- body contents -->
          <div class="flex flex-col items-start justify-start gap-5 w-full">
            <p class="body-xs">Please enter the e-mail address you defined as your Porsche ID.</p>
            <!-- input form -->
            <div class="flex flex-col w-full gap-4">
              <legend-textbox placeholder="Porsche ID" width="303px" height="auto"></legend-textbox>
              <div class="captcha-class flex items-center justify-center">
                <img class="captcha" src="../src/assets/image/captcha.svg" alt="captcha" />
              </div>
              <legend-textbox
                placeholder="Enter the code shown above"
                width="303px"
                height="auto"
              ></legend-textbox>
            </div>
            <!-- buttons and divider -->
            <div class="flex flex-col w-full gap-5">
              <base-button label="Login with password" variant="primary"></base-button>
              <base-button label="Get login code via email" variant="secondary"></base-button>
              <!-- divider-line -->
              <div class="flex flex-row items-center w-full">
                <div class="divider-line bg-black"></div>
                <span class="body-xs pr-3 pl-3">OR</span>
                <div class="divider-line bg-black"></div>
              </div>
              <base-button label="Create Porsche ID" variant="secondary"></base-button>
            </div>
          </div>
        </div>
      </form>
    </div>
    <!-- footer -->
    <footer-b></footer-b>
  </body>
</html>
