<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="module" src="/main.js"></script>
    <link rel="stylesheet" href="../../src/styles/index.css" />
    <link rel="stylesheet" href="../authentication-page/login-page.css" />
    <link rel="icon" type="image/svg" href="../../src/assets/brand-logo/porsche-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter your email code to login</title>
  </head>
  <body class="bg-black">
    <div class="bg-screen bg-white flex flex-col items-center justify-center">
      <!-- Left image shown only on large screens -->
      <div class="left-side-image">
        <img src="../../src/assets/image/bgAuthPage.webp" alt="Porsche promotional background" />
      </div>
      <!-- login card  -->
      <div class="login-card bg-white flex flex-row items-center justify-center px-5 py-5">
        <div class="login-card-contents bg-white w-full">
          <!-- header contents -->
          <div class="flex flex-col items-center justify-center">
            <img
              class="brand-logo"
              src="../../src/assets/brand-logo/porsche-icon-text.svg"
              alt="logotext"
            />
          </div>
          <div class="flex flex-col items-start justify-start mt-6 mb-4">
            <h3>Verify your email address</h3>
          </div>
          <!-- body contents -->
          <div class="flex flex-col items-start justify-start gap-5 w-full">
            <h6 class="body-xs">
              Please check your email inbox. We've sent the verification code to the following
              address: example@gmail.com
            </h6>
            <!-- input form -->
            <div class="otp-input flex flex-col w-full gap-2">
              <legend-textbox placeholder="Enter the 6-digits code*"></legend-textbox>
            </div>
            <div class="button-login flex flex-col w-full text-center">
              <base-button label="Continue" variant="primary" href="../../index.html"></base-button>
              <div class="flex flex-row w-full px-1 justify-center items-center">
                <h6 class="body-xs">Didn't receive a code?</h6>
                <icon-button class="signup" text="Resend"></icon-button>
              </div>
              <icon-button
                class="signup self-center text-p3"
                text="Go back"
                href="../../pages/authentication-page/login-page.html"
              ></icon-button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <footer>
    <footer-b></footer-b>
  </footer>
</html>
